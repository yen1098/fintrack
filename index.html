<script>
// Save modal inputs when app is hidden, restore after render
function saveModalDraft(){
  if(!AM)return;
  const draft={};
  document.querySelectorAll('.modal input,.modal select,.modal textarea').forEach(el=>{
    if(el.id)draft[el.id]=el.value;
  });
  sessionStorage.setItem('ft-modal-draft',JSON.stringify({modal:AM,draft}));
}
function restoreModalDraft(){
  try{
    const saved=JSON.parse(sessionStorage.getItem('ft-modal-draft')||'null');
    if(!saved||saved.modal!==AM)return;
    Object.entries(saved.draft).forEach(([id,val])=>{
      const el=document.getElementById(id);
      if(el&&el.value===''||el&&el.tagName==='TEXTAREA')el.value=val;
      else if(el&&el.tagName==='SELECT'){
        // Try to set select value
        const opt=[...el.options].find(o=>o.value===val);
        if(opt)el.value=val;
      }
    });
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden')saveModalDraft();
  if(document.visibilityState==='visible'&&AM){restoreModalDraft();}
});

async function signInWithGoogle(){
  document.getElementById('login-loading').style.display='block';
  document.getElementById('login-error').style.display='none';
  const {error}=await supa.auth.signInWithOAuth({
    provider:'google',
    options:{redirectTo:window.location.href}
  });
  if(error){
    document.getElementById('login-error').textContent=error.message;
    document.getElementById('login-error').style.display='block';
    document.getElementById('login-loading').style.display='none';
  }
}

async function signOut(){
  await supa.auth.signOut();
  currentUser=null;
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
}

async function initAuth(){
  const {data:{session}}=await supa.auth.getSession();
  if(session){
    currentUser=session.user;
    await loadFromCloud();
    showApp();
  } else {
    showLogin();
  }
  supa.auth.onAuthStateChange(async(event,session)=>{
    if(event==='SIGNED_IN'&&session){
      currentUser=session.user;
      const appEl=document.getElementById('app');
      const alreadyShowing=appEl&&appEl.style.display!=='none';
      if(!alreadyShowing){
        await loadFromCloud();
        showApp();
      } else {
        currentUser=session.user;
      }
    } else if(event==='SIGNED_OUT'){
      currentUser=null;
      showLogin();
    }
  });
}

}

function dbForStorage(){
  return JSON.parse(JSON.stringify(DB,(key,val)=>key==='_snap'?undefined:val));
}

async function forceSyncToCloud(){
  const ind=document.getElementById('sync-indicator');
  const lbl=document.getElementById('sync-label');
  const btn=document.getElementById('force-sync-btn');
  if(btn){btn.textContent='Syncing...';btn.disabled=true;}
  if(ind){ind.style.background='#EF9F27';if(lbl)lbl.textContent='Syncing...';}
  try{
    localStorage.setItem('fintrack2',JSON.stringify(DB));
    localStorage.setItem('ft-dflt-wallet',defaultFromWalletId||'');
    await saveToCloud();
    if(ind){ind.style.background='#3B6D11';if(lbl)lbl.textContent='Synced to cloud';}
    showToast('All data synced to cloud ✓');
  }catch(e){
    showToast('Sync failed — check connection');
  }
  if(btn){btn.textContent='Force sync to cloud';btn.disabled=false;}
}

async function loadFromCloud(){
  if(!currentUser)return;
  try{
    const {data,error}=await supa.from('fintrack_data').select('data,updated_at').eq('user_id',currentUser.id).single();
    if(data&&data.data){
      const parsed=JSON.parse(data.data);
      DB=parsed.db||{};
      defaultFromWalletId=parsed.defaultWallet||null;
      migrateDB();
      try{localStorage.setItem('fintrack2',JSON.stringify(dbForStorage()));}catch(e){}
      console.log('Loaded from cloud ✓');
    } else {
      const localRaw=localStorage.getItem('fintrack2');
      if(localRaw){
        try{DB=JSON.parse(localRaw);}catch(e){DB={};}
        migrateDB();
        await saveToCloud();
        console.log('No cloud data found — seeded from local and saved to cloud');
      } else {
        DB={wallets:[],transactions:[],funds:[],tasks:[],borrowings:[],resources:[],bonuses:[],transferGroups:[],creditCards:[],toSpend:{base:0,label:''},notes:[]};
        console.log('Fresh start');
      }
    }
  }catch(e){
    console.log('Cloud load error:',e);
    try{const r=localStorage.getItem('fintrack2');if(r)DB=JSON.parse(r);}catch(e2){}
    migrateDB();
  }
}

function ld(){
  try{
    const d=localStorage.getItem('fintrack2');
    if(d)DB=JSON.parse(d);
    defaultFromWalletId=localStorage.getItem('ft-dflt-wallet')||null;
    if(!d){const old=localStorage.getItem('fintrack');if(old)DB=JSON.parse(old);}
    migrateDB();
  }catch(e){}
}

function migrateDB(){
  if(!DB.creditCards)DB.creditCards=[];
  if(!DB.toSpend)DB.toSpend={base:0,label:'Monthly Income'};
  if(!DB.wallets)DB.wallets=[];
  if(!DB.transactions)DB.transactions=[];
  if(!DB.funds)DB.funds=[];
  if(!DB.tasks)DB.tasks=[];
  if(!DB.borrowings)DB.borrowings=[];
  if(!DB.resources)DB.resources=[];
  if(!DB.bonuses)DB.bonuses=[];
  if(!DB.transferGroups)DB.transferGroups=[];
}

const f$=n=>'₱'+Math.abs(Math.round(n)).toLocaleString();
const td=()=>new Date().toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
const vv=id=>{const e=document.getElementById(id);return e?e.value:'';};
const gW=id=>DB.wallets.find(x=>x.id===id);
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function addTx(o){
  const snap=JSON.stringify(DB,(key,val)=>key==='_snap'?undefined:val);
  const tx={id:uid(),rawDate:new Date().toISOString(),...o,date:td(),_snap:snap};
  DB.transactions.unshift(tx);
  DB.transactions.forEach((t,i)=>{if(i>=10)delete t._snap;});
  sv();
}

function undoTx(txId){
  const tx=DB.transactions.find(x=>x.id===txId);
  if(!tx||!tx._snap){return showToast('No undo data for this transaction');}
  if(!confirm('Undo this transaction? All wallet/fund balances will revert to before this action.'))return;
  DB=JSON.parse(tx._snap);
  sv();showToast('Transaction undone ↩');render();
}

function showToast(msg='✓ Done!',emoji=''){
  const el=document.getElementById('toast');
  el.textContent=(emoji?emoji+' ':'')+msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),1800);
}

function tasksDueSoon(){
  const now=new Date();const future=new Date();future.setDate(future.getDate()+3);
  return DB.tasks.filter(t=>!t.done&&t.due&&new Date(t.due)<=future).length;
}

function dbForStorage(){
  return JSON.parse(JSON.stringify(DB,(key,val)=>key==='_snap'?undefined:val));
}

function sv(){
  try{localStorage.setItem('fintrack2',JSON.stringify(dbForStorage()));}catch(e){}
  saveToCloud();
}

async function saveToCloud(){
  if(!currentUser)return;
  const si=document.getElementById('sync-indicator');
  const sl=document.getElementById('sync-label');
  try{
    if(si)si.style.background='#EF9F27';
    if(sl)sl.textContent='Saving...';
    const payload=JSON.stringify({db:dbForStorage(),defaultWallet:defaultFromWalletId,savedAt:Date.now()});
    const {error}=await supa.from('fintrack_data').upsert({user_id:currentUser.id,data:payload,updated_at:new Date().toISOString()},{onConflict:'user_id'});
    if(error)throw error;
    if(si)si.style.background='#4CAF82';
    if(sl)sl.textContent='Synced';
    clearSaveWarning();
  }catch(e){
    console.log('Cloud save error:',e);
    if(si)si.style.background='#E05C7A';
    if(sl)sl.textContent='Sync failed';
    showSaveWarning();
  }
}

function undoTx(txId){

  if(!tx||!tx._snap){return showToast('No undo data for this transaction');}

}

const tapTracker={};
function handleTxTap(txId){
  const now=Date.now();
  if(!tapTracker[txId]||now-tapTracker[txId].last>1200){
    tapTracker[txId]={count:1,last:now};
  } else {
    tapTracker[txId].count++;
    tapTracker[txId].last=now;
  }
  if(tapTracker[txId].count>=5){
    tapTracker[txId]={count:0,last:0};
    openAdvancedTx(txId);
  }
}

function openAdvancedTx(txId){
  const t=DB.transactions.find(x=>x.id===txId);
  if(!t)return;
  let paired=null;
  if(t.note&&t.note.includes('split bill')){
    paired=DB.transactions.find(x=>x.id!==txId&&x.name&&x.name.includes(t.name.replace(' (my share)','')));
  } else if(t.cat==='Transfer'&&t.walletId){
    paired=DB.transactions.find(x=>x.id!==txId&&x.cat==='Transfer'&&x.rawDate===t.rawDate);
  }
  AM='advancedTx';
  window._advTxId=txId;
  window._advTxPairedId=paired?paired.id:null;
  render();
}

function toggleTxUnlink(txId,type){
  const t=DB.transactions.find(x=>x.id===txId);
  if(!t)return;
  if(type==='wallet'){
    const wasUnlinked=!!t._unlinkWallet;
    t._unlinkWallet=!wasUnlinked;
    const w=t.walletId?DB.wallets.find(x=>x.id===t.walletId):null;
    if(w){
      if(t._unlinkWallet){
        if(t.type==='expense'){w.currentBalance+=t.amount;w.actualBalance+=t.amount;}
        else{w.currentBalance-=t.amount;w.actualBalance-=t.amount;}
      } else {
        if(t.type==='expense'){w.currentBalance-=t.amount;w.actualBalance-=t.amount;}
        else{w.currentBalance+=t.amount;w.actualBalance+=t.amount;}
      }
    }
    delete t._snap;
  } else if(type==='tospend'){
    t._unlinkToSpend=!t._unlinkToSpend;
    delete t._snap;
  }
  sv();render();
}

let calcExpr='';
function calcInput(k){
  const d=document.getElementById('calc-display');if(!d)return;
  const setVal=(v)=>{if(d.tagName==='INPUT')d.value=v;else d.textContent=v;};
  if(k==='AC'){calcExpr='';setVal('0');return;}
  if(k==='⌫'){calcExpr=calcExpr.slice(0,-1)||'';setVal(calcExpr||'0');return;}
  if(k==='='){
    try{
      const result=Function('"use strict";return ('+calcExpr+')')();
      calcExpr=String(Math.round(result*100)/100);
      setVal(isNaN(result)?'Error':calcExpr);
    }catch(e){setVal('Error');calcExpr='';}
    return;
  }
  calcExpr+=String(k);
  setVal(calcExpr);
}
function calcKeyHandler(e){
  const d=document.getElementById('calc-display');
  if(!d||document.activeElement!==d)return;
  if(e.key==='Enter'||e.key==='='){e.preventDefault();calcInput('=');}
  else if(e.key==='Escape'){e.preventDefault();calcInput('AC');}
}
function showCalcCopy(){
  const btn=document.getElementById('calc-copy-btn');
  if(!btn)return;
  btn.style.display='block';
  clearTimeout(window.calcCopyTimer);
  window.calcCopyTimer=setTimeout(()=>{btn.style.display='none';},2000);
}
function copyCalcValue(){
  const d=document.getElementById('calc-display');
  if(!d)return;
  const val=d.tagName==='INPUT'?d.value:d.textContent;
  navigator.clipboard.writeText(val).then(()=>{
    const btn=document.getElementById('calc-copy-btn');
    if(btn){btn.textContent='Copied!';setTimeout(()=>{btn.style.display='none';btn.textContent='Copy';},1000);}
  });

function calcToSpend(){
  let ts=DB.toSpend.base;
  DB.transactions.forEach(t=>{
    if(t._unlinkToSpend)return;
    if(t.type==='income' && t.cat!=='Transfer' && t.cat!=='Fund' && t.cat!=='Bonus'
      && t.note!=='Borrowing settlement'){
      ts+=t.amount;
    }
    if(t.type==='expense' && t.cat!=='Transfer' && t.cat!=='Fund' && t.walletId!==null
      && !(t.name&&t.name.includes('[CC:'))
      && t.note!=='Borrowing record' && t.note!=='Borrowing settlement'){
      ts-=t.amount;
    }
  });
  DB.transferGroups.forEach(g=>{g.transfers.forEach(t=>{ts-=t.amount;});});
  return ts;
}
